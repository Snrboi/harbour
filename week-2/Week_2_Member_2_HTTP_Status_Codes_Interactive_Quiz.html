<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 2 Member 2 – Interactive HTTP Quiz</title>
<style>
body{font:16px/1.5 Arial,sans-serif;max-width:900px;margin:auto;padding:20px;color:#222}h1{line-height:1.2}.intro{background:#eef2ff;padding:14px;border-radius:9px}.q{border:1px solid #ddd;border-radius:9px;padding:15px;margin:15px 0}.q label{display:block;margin:9px 0}button{padding:11px 17px;border:0;border-radius:7px;margin:8px 8px 8px 0;cursor:pointer}#submit{background:#14532d;color:white}#reset{background:#e5e7eb}.fb{display:none;padding:10px;border-radius:7px;margin-top:10px}.good{background:#dcfce7}.bad{background:#fee2e2}#score{font-size:1.2rem;font-weight:bold}
</style></head><body><h1>Week 2 – Member 2: HTTP Status Codes & Error Response Design</h1>
<div class="intro"><b>20-question interactive quiz.</b> Focus on 400, 404, 409, 422, 500 and useful error bodies. Extra questions cover other common HTTP status codes. Select one answer per question, then submit to see your score and explanations.</div>
<div id="quiz"></div><button id="submit">Submit answers</button><button id="reset">Try again</button><p id="score"></p>
<script>
const data=[["Malformed JSON cannot be parsed. Which code?", ["400 Bad Request", "404 Not Found", "409 Conflict", "500 Internal Server Error"], 0, "400 is appropriate when the request is malformed or cannot be interpreted."], ["Book ID 150 was looked up successfully and does not exist. Which code?", ["400", "404", "409", "422"], 1, "404 means the requested resource was not found."], ["A user tries to borrow a book that is already on loan. Which code?", ["400", "404", "409", "422"], 2, "409 describes a conflict with the resource's current state."], ["A numeric loan duration exceeds the permitted maximum. Which code?", ["400", "404", "409", "422"], 3, "422 means the request is understood but its content fails a validation rule."], ["An unexpected application failure prevents the request completing. Which code?", ["400", "404", "422", "500"], 3, "500 is used for an unexpected internal server failure."], ["What is the distinction between 400 and 422 in this lesson?", ["400 is malformed; 422 is understood content that fails a rule", "400 is server error; 422 is success", "They are identical", "400 is authentication"], 0, "400 concerns malformed/uninterpretable requests; 422 concerns understood content that fails validation. API conventions vary."], ["What is the distinction between 409 and 422?", ["409 is state conflict; 422 is invalid submitted content", "409 is success; 422 is redirect", "409 means missing resource", "They are identical"], 0, "409 is about current resource state; 422 is about submitted content."], ["The database connection fails, so the API cannot determine whether a book exists. Which code?", ["404", "500", "201", "204"], 1, "A database connection failure is a server-side failure; the API cannot truthfully claim the book is absent."], ["Which error response is most useful for a missing book?", ["Oops", "Something went wrong", "A 404 with missing book ID and helpful next step", "A raw traceback"], 2, "A useful body explains the problem and gives safe, relevant context."], ["Why avoid raw tracebacks in client responses?", ["They are too short", "They may reveal internal paths or implementation details", "They make HTTP slower", "They change 500 to 404"], 1, "Detailed exceptions belong in protected server logs, not public responses."], ["Which code indicates success and may include a response body?", ["200 OK", "301", "404", "503"], 0, "200 OK indicates success and may include a response body."], ["A new book record is successfully created. Which code is commonly appropriate?", ["200", "201 Created", "204", "409"], 1, "201 Created indicates that a resource was created."], ["The operation succeeds and the API intentionally returns no body. Which code?", ["200", "201", "204 No Content", "404"], 2, "204 indicates success with no response body."], ["What does the 1xx family generally mean?", ["Client error", "Informational", "Redirection", "Server error"], 1, "1xx responses are informational."], ["What does the 3xx family generally indicate?", ["Success", "Client error", "Redirection", "Server error"], 2, "3xx responses indicate further action, commonly redirection."], ["A user has missing or invalid authentication credentials. Which code is commonly used?", ["401 Unauthorized", "403 Forbidden", "404", "409"], 0, "401 concerns authentication."], ["The server understands the request but refuses access because the user is not authorised. Which code?", ["401", "403 Forbidden", "404", "422"], 1, "403 means the server refuses to authorise the requested action."], ["A client sends too many requests in a short period. Which code?", ["408", "413", "429 Too Many Requests", "500"], 2, "429 indicates too many requests in a given period."], ["A gateway does not receive a timely response from an upstream server. Which code?", ["502", "503", "504 Gateway Timeout", "422"], 2, "504 indicates a gateway/proxy timeout waiting for an upstream response."], ["What is a good API error-design principle?", ["Expose all internal debugging data", "Use consistent structure, clear message, safe details, no secrets", "Use 500 for every error", "Never explain errors"], 1, "Good error responses are consistent, useful, and safe."]];
const root=document.getElementById('quiz');
data.forEach((x,i)=>{let s=document.createElement('section');s.className='q';let h=document.createElement('h3');h.textContent=(i+1)+'. '+x[0];s.appendChild(h);x[1].forEach((a,j)=>{let l=document.createElement('label');l.innerHTML='<input type="radio" name="q'+i+'" value="'+j+'"> '+a;s.appendChild(l)});let f=document.createElement('div');f.className='fb';f.id='f'+i;s.appendChild(f);root.appendChild(s)});
document.getElementById('submit').onclick=()=>{let n=0;data.forEach((x,i)=>{let c=document.querySelector('input[name="q'+i+'"]:checked'),f=document.getElementById('f'+i);f.style.display='block';if(c&&Number(c.value)===x[2]){n++;f.className='fb good';f.textContent='Correct. '+x[3]}else{f.className='fb bad';f.textContent='Not quite. Correct answer: '+x[1][x[2]]+'. '+x[3]}});document.getElementById('score').textContent='Your score: '+n+' / '+data.length+' ('+Math.round(n/data.length*100)+'%)';window.scrollTo({top:document.getElementById('score').offsetTop-20,behavior:'smooth'})};
document.getElementById('reset').onclick=()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('.fb').forEach(x=>{x.style.display='none';x.textContent='' });document.getElementById('score').textContent='';window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
